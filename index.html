<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TC Games — Dice Defense</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header><div><h1>🎲 Dice Defense</h1><p>주사위로 이동하고, 10턴 뒤 디펜스를 준비하세요.</p></div>
  <div class="status"><span>💰 <b id="gold">100</b></span><span>❤️ <b id="hp">100</b></span><span>🎲 턴 <b id="turn">0</b>/10</span></div></header>
  <main>
    <section class="board-wrap"><canvas id="board" width="900" height="650"></canvas></section>
    <aside>
      <div class="card"><h2>현재 칸</h2><div id="tileInfo">출발점</div></div>
      <div class="card"><h2>주사위</h2><div id="dice" class="dice">?</div><button id="roll">주사위 굴리기</button><div id="message">게임을 시작하세요.</div></div>
      <div class="card"><h2>다음 디펜스</h2><div>웨이브 <b id="wave">1</b></div><div class="bar"><i id="prep"></i></div><small>보드에서 얻은 모든 보상은 디펜스에서 사용됩니다.</small></div>
    </aside>
  </main>
</div>
<script src="game.js"></script>
</body>
</html>
